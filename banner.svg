<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-label="横幅：重庆大学 自动驾驶 机器学习与人工智能">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#071246"/>
      <stop offset="1" stop-color="#0b3b6e"/>
    </linearGradient>
    <linearGradient id="road" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <filter id="blur2"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <!-- 背景 -->
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <g opacity="0.06" fill="#ffffff">
    <rect x="80" y="30" width="260" height="120" rx="12"/>
    <rect x="420" y="10" width="340" height="110" rx="12"/>
  </g>

  <!-- 重庆天际线简化轮廓（左侧） -->
  <g transform="translate(60,80)" fill="#061731">
    <rect x="0" y="90" width="40" height="80"/>
    <rect x="60" y="60" width="50" height="110"/>
    <rect x="130" y="40" width="36" height="130"/>
    <rect x="180" y="0" width="80" height="170"/>
    <path d="M300 150 L320 110 L340 140 L360 100 L380 150 Z"/>
  </g>

  <!-- 主体：道路与车辆（中央） -->
  <g transform="translate(0,180)">
    <rect x="0" y="40" width="1500" height="120" fill="url(#road)"/>
    <!-- 中间车道线 -->
    <g stroke="#ffd54f" stroke-width="6" stroke-linecap="round">
      <line x1="200" y1="100" x2="380" y2="100" />
      <line x1="460" y1="100" x2="640" y2="100" />
      <line x1="720" y1="100" x2="900" y2="100" />
      <line x1="980" y1="100" x2="1160" y2="100" />
    </g>

    <!-- 汽车（简洁图形） -->
    <g transform="translate(700,40) scale(1.2)">
      <path d="M-120 20 L120 20 C150 20 170 40 170 70 L170 110 C170 140 140 160 110 160 L-110 160 C-140 160 -170 135 -170 110 L-170 70 C-170 40 -140 20 -120 20 Z"
            fill="#1fb6ff" stroke="#ffffff33" stroke-width="3"/>
      <circle cx="-50" cy="170" r="18" fill="#000"/>
      <circle cx="50" cy="170" r="18" fill="#000"/>
      <circle cx="-50" cy="170" r="8" fill="#7c3aed"/>
      <circle cx="50" cy="170" r="8" fill="#7c3aed"/>
    </g>
  </g>

  <!-- LiDAR 扫描弧（车辆前方） -->
  <g transform="translate(930,220)">
    <path d="M0 0 L220 -90 A300 300 0 0 1 220 90 Z" fill="#00ffbf44" />
    <path d="M0 0 L150 -60 A200 200 0 0 1 150 60 Z" fill="#00ffbf22" />
  </g>

  <!-- 神经网络风格装饰（右侧） -->
  <g transform="translate(1160,60)" stroke="#9be7ff66" stroke-width="2" fill="#9be7ff88">
    <line x1="0" y1="40" x2="60" y2="0"/>
    <line x1="20" y1="80" x2="100" y2="20"/>
    <circle cx="0" cy="40" r="6"/>
    <circle cx="20" cy="80" r="6"/>
    <circle cx="60" cy="0" r="6"/>
    <circle cx="100" cy="20" r="6"/>
  </g>

  <!-- 文字：你的信息（中文） -->
  <g transform="translate(80,60)">
    <text x="0" y="0" font-family="Segoe UI, Arial, Noto Sans SC" font-size="44" fill="#ffffff">shanshi217</text>
    <text x="0" y="48" font-family="Segoe UI, Arial, Noto Sans SC" font-size="20" fill="#cfefff">重庆大学 · 自动驾驶 · 机器学习与人工智能</text>
    <rect x="0" y="70" width="420" height="2" fill="#7c3aed" rx="1"/>
  </g>

  <metadata>
    Created for: shanshi217 (Chongqing Univ, Autonomous Driving, ML/AI)
  </metadata>
</svg>
